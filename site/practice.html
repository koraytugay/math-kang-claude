<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kangaroo Practice</title>
    <link rel="stylesheet" href="https://koraytugay.github.io/kt-styles/dist/kt.min.css">
    <style>
        /* layout glue only */
        .mk-page { max-width: 1000px; }
        .mk-lock { max-width: 420px; margin: var(--kt-space-8) auto 0; }
        .mk-qtext { font-size: var(--kt-fs-lg); line-height: var(--kt-leading-normal); }
        .mk-rich p { margin: 0 0 0.6em; }
        .mk-rich ul { margin: 0 0 0.6em; padding-left: 1.4em; }
        .mk-rich li { margin: 0.15em 0; }
        .mk-rich > :last-child { margin-bottom: 0; }
        .mk-fig { text-align: center; margin: var(--kt-space-4) 0; }
        .mk-fig svg, .kt-choice svg { max-width: 100%; height: auto; }
        .mk-fig svg { display: block; margin: 0 auto; }
        .mk-opt-text { font-size: var(--kt-fs-lg); }
        /* one circle per answer: right green, right on the 2nd try light green, wrong an empty ring
           (a learning opportunity, never red), skipped grey */
        .mk-dots { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 18px; }
        .mk-dot { width: 18px; height: 18px; border-radius: 50%; box-sizing: border-box; }
        .mk-dot--right { background: var(--kt-success); }
        .mk-dot--second { background: var(--kt-success-soft); border: 3px solid var(--kt-success); }
        .mk-dot--learn { border: 2px solid var(--kt-border-strong); }
        .mk-dot--skip { background: var(--kt-border); }
        .mk-cheer { font-size: var(--kt-fs-2xl); font-weight: 700; line-height: 1.3; }
        .mk-cheer + div { margin-top: var(--kt-space-2); font-size: var(--kt-fs-lg); }
    </style>
</head>
<body>
<div class="kt-container mk-page">
    <header class="kt-page-header">
        <h1 class="kt-page-title">Kangaroo Practice</h1>
    </header>

    <!-- password -->
    <section id="lock" hidden>
        <form class="kt-card kt-card--padded kt-stack mk-lock" id="lock-form">
            <h2 class="kt-section-title kt-m-0">Password</h2>
            <p>Type the password to start practising.</p>
            <input class="kt-input" type="password" id="lock-password" autocomplete="current-password" placeholder="Password">
            <label class="kt-check"><input type="checkbox" id="lock-remember" checked> Remember on this computer</label>
            <div class="kt-alert kt-alert--danger" id="lock-error" hidden></div>
            <div><button type="submit" class="kt-btn kt-btn--primary" id="lock-btn">Unlock</button></div>
        </form>
    </section>

    <!-- who is practising -->
    <section id="who" hidden>
        <h2 class="kt-section-title">Who's practising?</h2>
        <div class="kt-grid kt-grid--3 kt-mt-3" id="profiles"></div>
    </section>

    <!-- a question -->
    <section id="play" hidden>
        <div class="kt-split kt-mb-3">
            <div class="mk-dots" id="dots" aria-label="Your answers so far"></div>
            <div class="kt-cluster">
                <button type="button" class="kt-btn kt-btn--ghost" id="quit">Stop</button>
            </div>
        </div>

        <div class="kt-card kt-card--padded">
            <div class="mk-qtext mk-rich" id="q-text"></div>
            <div class="mk-fig" id="q-fig"></div>
            <div class="mk-qtext mk-rich" id="q-after"></div>
        </div>
        <div class="kt-choices kt-mt-4" id="q-options"></div>
        <div class="kt-alert kt-alert--warning kt-mt-4" id="retry" hidden></div>
        <div class="kt-cluster kt-mt-4" id="skip-row">
            <button type="button" class="kt-btn kt-btn--primary kt-btn--lg" id="check" disabled>Check my answer</button>
            <button type="button" class="kt-btn kt-btn--lg kt-ml-auto" id="skip">Skip question</button>
        </div>

        <div class="kt-mt-4" id="feedback" hidden>
            <div class="kt-alert" id="feedback-text"></div>
            <div class="kt-alert kt-alert--info kt-mt-3" id="break" hidden>
                <div class="kt-alert__title">Great work - you've been practising for a while!</div>
                Take a break if you like, or keep going.
                <div class="kt-mt-2"><button type="button" class="kt-btn" id="break-stop">Stop for now</button></div>
            </div>
            <div class="kt-cluster kt-mt-3">
                <button type="button" class="kt-btn kt-btn--primary kt-btn--lg" id="next">Next question</button>
                <button type="button" class="kt-btn kt-btn--lg" id="teach-btn" hidden>How to think about it</button>
            </div>
        </div>
    </section>

    <!-- summary -->
    <section id="done" hidden>
        <h2 class="kt-section-title" id="done-title"></h2>
        <div class="kt-stack kt-mt-4" id="done-mistakes"></div>
        <div class="kt-cluster kt-mt-4">
            <button type="button" class="kt-btn kt-btn--primary kt-btn--lg" id="again">Practise again</button>
            <button type="button" class="kt-btn kt-btn--lg" id="switch">Switch profile</button>
        </div>
    </section>
</div>
<!-- teaching page -->
<div class="kt-modal kt-modal--lg" id="teach" role="dialog" aria-modal="true" aria-labelledby="teach-title">
    <div class="kt-modal__dialog">
        <div class="kt-modal__header">
            <h2 class="kt-modal__title" id="teach-title">How to think about it</h2>
            <button type="button" class="kt-btn kt-btn--ghost kt-btn--icon kt-modal__close" aria-label="Close">✕</button>
        </div>
        <div class="kt-modal__body kt-stack" id="teach-body"></div>
        <div class="kt-modal__footer">
            <button type="button" class="kt-btn kt-btn--primary kt-modal__close">Back to the question</button>
        </div>
    </div>
</div>

<script src="secrets.js"></script>
<script src="smart.js"></script>
<script src="practice.js"></script>
</body>
</html>
