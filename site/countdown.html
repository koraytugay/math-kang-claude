<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kangaroo Countdown</title>
    <link rel="stylesheet" href="https://koraytugay.github.io/kt-styles/dist/kt.min.css">
    <style>
        /* A playful page for the kids (both together, never one against the other). Page-only styles. */
        .mk-page { max-width: 1100px; padding-bottom: var(--kt-space-12); }
        .mk-lock { max-width: 420px; margin: var(--kt-space-8) auto 0; }

        .mk-hero {
            position: relative; overflow: hidden; text-align: center; color: #fff;
            border-radius: var(--kt-radius-xl); padding: var(--kt-space-8) var(--kt-space-6);
            background: linear-gradient(135deg, var(--kt-purple), var(--kt-blue) 55%, var(--kt-teal));
            box-shadow: var(--kt-shadow-lg);
        }
        .mk-hero__kicker { font-size: var(--kt-fs-xl); font-weight: var(--kt-weight-semibold); opacity: .92; }
        .mk-hero__days { font-size: 7.5rem; line-height: 1; font-weight: var(--kt-weight-heavy); letter-spacing: -0.04em; margin: var(--kt-space-3) 0 var(--kt-space-1); }
        .mk-hero__unit { font-size: var(--kt-fs-3xl); font-weight: var(--kt-weight-bold); }
        .mk-hero__clock { font-family: var(--kt-font-mono); font-size: var(--kt-fs-xl); opacity: .9; margin-top: var(--kt-space-2); }
        .mk-hero__cheer { font-size: var(--kt-fs-xl); margin-top: var(--kt-space-4); min-height: 1.5em; }
        .mk-roo { position: absolute; bottom: 14px; font-size: 3.4rem; animation: mk-hop 9s linear infinite; }
        @keyframes mk-hop {
            0%   { left: -8%;  transform: translateY(0) scaleX(-1); }
            5%   { transform: translateY(-38px) scaleX(-1); } 10% { transform: translateY(0) scaleX(-1); }
            15%  { transform: translateY(-38px) scaleX(-1); } 20% { transform: translateY(0) scaleX(-1); }
            25%  { transform: translateY(-38px) scaleX(-1); } 30% { transform: translateY(0) scaleX(-1); }
            35%  { transform: translateY(-38px) scaleX(-1); } 40% { transform: translateY(0) scaleX(-1); }
            45%  { transform: translateY(-38px) scaleX(-1); } 50% { transform: translateY(0) scaleX(-1); }
            55%  { transform: translateY(-38px) scaleX(-1); } 60% { transform: translateY(0) scaleX(-1); }
            65%  { transform: translateY(-38px) scaleX(-1); } 70% { transform: translateY(0) scaleX(-1); }
            75%  { transform: translateY(-38px) scaleX(-1); } 80% { transform: translateY(0) scaleX(-1); }
            85%  { transform: translateY(-38px) scaleX(-1); } 90% { transform: translateY(0) scaleX(-1); }
            100% { left: 104%; transform: translateY(0) scaleX(-1); }
        }

        .mk-h2 { font-size: var(--kt-fs-2xl); font-weight: var(--kt-weight-bold); margin: var(--kt-space-8) 0 var(--kt-space-3); }
        .mk-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--kt-space-4); }
        .mk-stat {
            border-radius: var(--kt-radius-lg); padding: var(--kt-space-5); color: #fff; box-shadow: var(--kt-shadow-lg);
            transition: transform var(--kt-transition);
        }
        .mk-stat:hover { transform: translateY(-4px) rotate(-1deg); }
        .mk-stat__icon { font-size: 2.4rem; }
        .mk-stat__value { font-size: 3.2rem; font-weight: var(--kt-weight-heavy); line-height: 1.1; }
        .mk-stat__label { font-size: var(--kt-fs-lg); font-weight: var(--kt-weight-semibold); opacity: .95; }
        .mk-c1 { background: var(--kt-green); } .mk-c2 { background: var(--kt-orange); }
        .mk-c3 { background: var(--kt-pink); }  .mk-c4 { background: var(--kt-purple); }

        .mk-goal { border-radius: var(--kt-radius-lg); padding: var(--kt-space-5); background: var(--kt-surface); border: 2px solid var(--kt-border); }
        .mk-goal__top { display: flex; justify-content: space-between; align-items: baseline; font-size: var(--kt-fs-xl); font-weight: var(--kt-weight-semibold); }
        .mk-bar { height: 28px; border-radius: var(--kt-radius-full); background: var(--kt-surface-sunken); overflow: hidden; margin: var(--kt-space-3) 0; }
        .mk-bar__fill {
            height: 100%; width: 0; border-radius: inherit; transition: width 1.6s cubic-bezier(.2,.8,.2,1);
            background: repeating-linear-gradient(45deg, var(--kt-gold), var(--kt-gold) 14px, var(--kt-orange) 14px, var(--kt-orange) 28px);
        }
        .mk-goal__note { font-size: var(--kt-fs-lg); color: var(--kt-text-secondary); }
        .mk-flags { display: flex; flex-wrap: wrap; gap: var(--kt-space-2); margin-top: var(--kt-space-4); }
        .mk-flag { white-space: nowrap; border-radius: var(--kt-radius-full); padding: 6px 12px; font-weight: var(--kt-weight-semibold); font-size: var(--kt-fs-md);
                   background: var(--kt-surface-sunken); color: var(--kt-text-muted); }
        .mk-flag--done { background: var(--kt-success); color: #fff; }
        /* the ultimate goal: its own big shiny pill */
        .mk-booster {
            position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
            gap: var(--kt-space-4); flex-wrap: wrap; margin-top: var(--kt-space-5); padding: var(--kt-space-4) var(--kt-space-6);
            border-radius: var(--kt-radius-full); color: #1b2a6b; text-align: center;
            background: linear-gradient(90deg, #ffd23f, #ffb300 40%, #ff7a3d 70%, #ffd23f);
            border: 4px solid #2a5bd7; box-shadow: 0 0 0 4px #ffd23f, 0 10px 30px rgba(42, 91, 215, .45);
            animation: mk-glow 1.6s ease-in-out infinite alternate;
        }
        .mk-booster::after {               /* a shine sweeping across */
            content: ""; position: absolute; top: 0; bottom: 0; width: 30%; left: -40%;
            background: linear-gradient(100deg, transparent, rgba(255,255,255,.75), transparent);
            animation: mk-shine 2.6s ease-in-out infinite;
        }
        .mk-booster__num { font-size: var(--kt-fs-2xl); font-weight: var(--kt-weight-heavy);
                           background: #2a5bd7; color: #ffd23f; border-radius: var(--kt-radius-full); padding: 4px 16px; }
        .mk-booster__text { font-size: 2.2rem; font-weight: var(--kt-weight-heavy); letter-spacing: .02em;
                            text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff; }
        .mk-booster__sub { font-size: var(--kt-fs-lg); font-weight: var(--kt-weight-bold); }
        .mk-booster--got { background: linear-gradient(90deg, #7be495, #ffd23f, #7be495); }
        @keyframes mk-glow { from { transform: scale(1); } to { transform: scale(1.025); box-shadow: 0 0 0 4px #ffd23f, 0 0 40px rgba(255, 210, 63, .9); } }
        @keyframes mk-shine { 0% { left: -40%; } 60%, 100% { left: 120%; } }
        @media (prefers-reduced-motion: reduce) { .mk-booster, .mk-booster::after { animation: none; } }
        .mk-bar__fill--weekend { background: repeating-linear-gradient(45deg, var(--kt-teal), var(--kt-teal) 14px, var(--kt-green) 14px, var(--kt-green) 28px); }

        .mk-stickers { display: grid; grid-template-columns: repeat(6, 1fr); gap: var(--kt-space-4); }
        .mk-sticker {
            text-align: center; padding: var(--kt-space-4) var(--kt-space-2); border-radius: var(--kt-radius-xl);
            background: var(--kt-surface); border: 3px dashed var(--kt-border-strong);
        }
        .mk-sticker__emoji { font-size: 3.2rem; line-height: 1.2; }
        .mk-sticker__name { font-weight: var(--kt-weight-bold); font-size: var(--kt-fs-md); margin-top: var(--kt-space-1); }
        .mk-sticker__how { font-size: var(--kt-fs-sm); color: var(--kt-text-secondary); margin-top: 2px; }
        .mk-sticker--got { border: 3px solid var(--kt-gold); background: var(--kt-surface); box-shadow: var(--kt-shadow-lg); }
        .mk-sticker--got:nth-child(odd) { transform: rotate(-3deg); } .mk-sticker--got:nth-child(even) { transform: rotate(2deg); }
        .mk-sticker--got:hover { transform: scale(1.08) rotate(0); transition: transform var(--kt-transition); }
        .mk-sticker--locked .mk-sticker__emoji { filter: grayscale(1); opacity: .25; }
        .mk-sticker--new { animation: mk-pop 1s ease-out 3; }
        @keyframes mk-pop { 50% { transform: scale(1.15) rotate(4deg); } }

        .mk-confetti { position: fixed; top: -20px; width: 10px; height: 16px; z-index: 50; pointer-events: none;
                       animation: mk-fall linear forwards; }
        @keyframes mk-fall { to { transform: translateY(110vh) rotate(720deg); } }
        @media (prefers-reduced-motion: reduce) {
            .mk-roo, .mk-sticker--new, .mk-confetti { animation: none; }
            .mk-confetti { display: none; }
        }
    </style>
</head>
<body>
<div class="kt-container mk-page">
    <section id="lock" hidden>
        <form class="kt-card kt-card--padded kt-stack mk-lock" id="lock-form">
            <h2 class="kt-section-title kt-m-0">Password</h2>
            <input class="kt-input" type="password" id="lock-password" autocomplete="current-password" placeholder="Password">
            <label class="kt-check"><input type="checkbox" id="lock-remember" checked> Remember on this computer</label>
            <div class="kt-alert kt-alert--danger" id="lock-error" hidden></div>
            <div><button type="submit" class="kt-btn kt-btn--primary" id="lock-btn">Unlock</button></div>
        </form>
    </section>

    <section id="view" hidden>
        <div class="mk-hero kt-mt-6">
            <div class="mk-hero__kicker">Math Kangaroo · Sunday, March 21, 2027</div>
            <div class="mk-hero__days" id="days">–</div>
            <div class="mk-hero__unit" id="days-unit">days to go!</div>
            <div class="mk-hero__clock" id="clock"></div>
            <div class="mk-hero__cheer" id="cheer"></div>
            <div class="mk-roo" aria-hidden="true">🦘</div>
        </div>

        <div class="kt-loading kt-mt-6" id="loading"><div class="kt-spinner"></div>Counting your questions…</div>
        <div id="content" hidden>
            <h2 class="mk-h2">Team Kangaroo so far</h2>
            <div class="mk-stats" id="stats"></div>

            <h2 class="mk-h2">Weekend goal</h2>
            <div class="mk-goal">
                <div class="mk-goal__top"><span id="wk-title"></span><span id="wk-count"></span></div>
                <div class="mk-bar"><div class="mk-bar__fill mk-bar__fill--weekend" id="wk-bar"></div></div>
                <div class="mk-goal__note" id="wk-note"></div>
            </div>

            <h2 class="mk-h2">Next goal</h2>
            <div class="mk-goal">
                <div class="mk-goal__top"><span id="goal-title"></span></div>
                <div class="mk-bar"><div class="mk-bar__fill" id="goal-bar"></div></div>
                <div class="mk-goal__note" id="goal-note"></div>
                <div class="mk-flags" id="flags"></div>
            </div>

            <h2 class="mk-h2">Sticker book <span class="kt-text-secondary" id="sticker-count" style="font-weight:400"></span></h2>
            <div class="mk-stickers" id="stickers"></div>
        </div>
    </section>
</div>
<script src="secrets.js"></script>
<script src="smart.js"></script>
<script src="countdown.js"></script>
</body>
</html>
