name: Generate Practice Exam

on:
  workflow_dispatch:
    inputs:
      questions:
        description: 'Number of questions'
        required: false
        default: '20'
        type: string
      one_each:
        description: 'Just 1 from each: one question of each kind from the ticked contests (the number of questions is ignored)'
        required: false
        default: false
        type: boolean
      harder:
        description: 'Harder exam: more 5-point questions and bigger numbers'
        required: false
        default: true
        type: boolean
      seed:
        description: 'Seed number to repeat an earlier exam exactly (leave blank for a new random exam)'
        required: false
        type: string
      website:
        description: 'Filled in by the exam website (the chosen questions). Leave empty here.'
        required: false
        type: string

      # Whole contests (tick the ones you want). Leave everything empty for all questions.
      # BEGIN contests - written by `python check.py --catalog`, do not edit by hand
      canada_2002:
        description: 'Canada Math Kangaroo 2002, Grade 3-4: missing square, perimeter, matching pieces, balance scales, clock sums, flag silhouettes, logic clues, cube counting, make a target number, seating arrangements, odometer'
        type: boolean
        default: false
      canada_2003:
        description: 'Canada Math Kangaroo 2003, Grade 3-4: cube counting, length units, page numbers, bar code, covering shapes'
        type: boolean
        default: false
      canada_2007:
        description: 'Canada Math Kangaroo 2007, Grade 3-4: routes through forks, common letters, digit sum, working backwards, completing a rectangle, dates, cube counting, painted cube, growing patterns, counting digits, paper folding'
        type: boolean
        default: false
      austria_2023:
        description: 'Austrian Kangaroo 2023, Ecolier Grade 3-4: fill the shape, houses and streets, colouring circles'
        type: boolean
        default: false
      austria_2024:
        description: 'Austrian Kangaroo 2024, Ecolier Grade 3-4: puzzle-piece chains, two repeating patterns, hiding digits, frogs jumping, building with parts, cookies on a tray'
        type: boolean
        default: false
      austria_2025:
        description: 'Austrian Kangaroo 2025, Ecolier Grade 3-4: runners on a circle, bracelet'
        type: boolean
        default: false
      # END contests

permissions:
  contents: write

jobs:
  generate-exam:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate practice exam
        id: generate
        env:
          QUESTIONS: ${{ inputs.questions }}
          SEED: ${{ inputs.seed }}
          WEBSITE: ${{ inputs.website }}
        run: |
          ARGS=("-n" "${QUESTIONS:-20}")
          if [ "${{ inputs.harder }}" != "false" ]; then
            ARGS+=("--harder")
          fi
          if [ -n "$SEED" ]; then
            ARGS+=("--seed" "$SEED")
          fi
          if [ "${{ inputs.one_each }}" = "true" ]; then
            ARGS+=("--one-each")
          fi

          # Questions chosen on the website, plus ticked contests
          SOURCES=()
          if [ "${WEBSITE#plan:}" != "$WEBSITE" ]; then
            ARGS+=("--plan" "${WEBSITE#plan:}")          # personal exam: name + planned skills
          elif [ -n "$WEBSITE" ]; then
            SOURCES+=("$WEBSITE")
          fi
          # BEGIN contest-sources - written by `python check.py --catalog`, do not edit by hand
          if [ "${{ inputs.canada_2002 }}" = "true" ]; then SOURCES+=("set-03/2002"); fi
          if [ "${{ inputs.canada_2003 }}" = "true" ]; then SOURCES+=("set-03/2003"); fi
          if [ "${{ inputs.canada_2007 }}" = "true" ]; then SOURCES+=("set-03/2007"); fi
          if [ "${{ inputs.austria_2023 }}" = "true" ]; then SOURCES+=("set-01/2023"); fi
          if [ "${{ inputs.austria_2024 }}" = "true" ]; then SOURCES+=("set-01/2024"); fi
          if [ "${{ inputs.austria_2025 }}" = "true" ]; then SOURCES+=("set-01/2025"); fi
          # END contest-sources

          if [ ${#SOURCES[@]} -gt 0 ]; then
            ARGS+=("--from" "${SOURCES[@]}")
          fi

          python make_exam.py "${ARGS[@]}"

          LATEST_PDF=$(ls -t output/exams/*.pdf 2>/dev/null | head -n 1)
          if [ -n "$LATEST_PDF" ]; then
            echo "pdf_path=$LATEST_PDF" >> "$GITHUB_OUTPUT"
            echo "pdf_name=$(basename "$LATEST_PDF")" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push generated exam
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/exams/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            PDF_NAME="${{ steps.generate.outputs.pdf_name }}"
            if [ -n "$PDF_NAME" ]; then
              git commit -m "Generate practice exam: $PDF_NAME"
            else
              git commit -m "Generate practice exam"
            fi
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "${{ github.ref_name }}"
          fi

      - name: Upload exam artifact
        if: steps.generate.outputs.pdf_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.generate.outputs.pdf_name }}
          path: ${{ steps.generate.outputs.pdf_path }}
