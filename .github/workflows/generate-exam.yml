name: Generate Practice Exam

on:
  workflow_dispatch:
    inputs:
      questions:
        description: 'Number of questions'
        required: false
        default: '20'
        type: string
      harder:
        description: 'Generate harder mix (--harder)'
        required: false
        default: true
        type: boolean
      seed:
        description: 'Specific seed (optional, leave blank for random)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate-exam:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate practice exam
        id: generate
        run: |
          ARGS=("-n" "${{ inputs.questions || '20' }}")
          if [ "${{ inputs.harder }}" != "false" ]; then
            ARGS+=("--harder")
          fi
          if [ -n "${{ inputs.seed }}" ]; then
            ARGS+=("--seed" "${{ inputs.seed }}")
          fi
          python make_exam.py "${ARGS[@]}"

          LATEST_PDF=$(ls -t output/exam-*.pdf 2>/dev/null | head -n 1)
          if [ -n "$LATEST_PDF" ]; then
            echo "pdf_path=$LATEST_PDF" >> "$GITHUB_OUTPUT"
            echo "pdf_name=$(basename "$LATEST_PDF")" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push generated exam
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            PDF_NAME="${{ steps.generate.outputs.pdf_name }}"
            if [ -n "$PDF_NAME" ]; then
              git commit -m "Generate practice exam: $PDF_NAME"
            else
              git commit -m "Generate practice exam (20 questions, harder)"
            fi
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "${{ github.ref_name }}"
          fi

      - name: Upload exam artifact
        if: steps.generate.outputs.pdf_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.generate.outputs.pdf_name }}
          path: ${{ steps.generate.outputs.pdf_path }}
